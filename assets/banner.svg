<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150826"/>
      <stop offset="45%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- abstract violet blobs -->
  <ellipse cx="180" cy="80" rx="260" ry="180" fill="url(#violet)" filter="url(#blur)"/>
  <ellipse cx="980" cy="300" rx="300" ry="200" fill="url(#fuchsia)" filter="url(#blur)" opacity="0.85"/>
  <ellipse cx="680" cy="120" rx="280" ry="170" fill="url(#deep)" filter="url(#blur)"/>
  <ellipse cx="1050" cy="60" rx="180" ry="120" fill="#c084fc" filter="url(#blur)" opacity="0.7"/>
  <ellipse cx="80" cy="320" rx="200" ry="130" fill="#6d28d9" filter="url(#blur)" opacity="0.8"/>

  <!-- abstract rings and arcs -->
  <circle cx="1020" cy="90" r="110" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="1020" cy="90" r="78" fill="none" stroke="#e9d5ff" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="1020" cy="90" r="46" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="150" cy="270" r="68" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="150" cy="270" r="38" fill="#ddd6fe" fill-opacity="0.25"/>

  <!-- flowing waves -->
  <path d="M0,240 C200,180 380,300 600,240 C820,180 1000,300 1200,230 L1200,360 L0,360 Z" fill="#7c3aed" fill-opacity="0.28"/>
  <path d="M0,280 C220,230 420,320 640,270 C860,220 1040,310 1200,270 L1200,360 L0,360 Z" fill="#a855f7" fill-opacity="0.22"/>
  <path d="M0,200 C180,260 360,150 560,200 C760,250 960,150 1200,210" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
  <path d="M0,310 C200,270 400,330 620,295 C840,260 1020,325 1200,290" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- dots -->
  <g fill="#e9d5ff">
    <circle cx="420" cy="70" r="4" opacity="0.8"/>
    <circle cx="460" cy="95" r="3" opacity="0.6"/>
    <circle cx="390" cy="110" r="3" opacity="0.5"/>
    <circle cx="760" cy="260" r="4" opacity="0.8"/>
    <circle cx="800" cy="285" r="3" opacity="0.6"/>
    <circle cx="730" cy="295" r="3" opacity="0.5"/>
    <circle cx="560" cy="50" r="3" opacity="0.6"/>
  </g>

  <!-- title -->
  <text x="600" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="2" fill="#f5f3ff">muse-codez</text>
  <text x="600" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#c4b5fd">CODE  •  BUILD  •  SHIP</text>
  <rect x="520" y="232" width="160" height="4" rx="2" fill="#a855f7"/>
</svg>
